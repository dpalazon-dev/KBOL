[project]
name = "kbol-di"
version = "0.3.0"
description = "KBOL Document Intelligence: fingerprinted capture, Docling and MarkItDown, structure, fidelity and navigable folder of each document"
requires-python = ">=3.12"
dependencies = [
    "docling==2.142.1",
    "markitdown==0.1.9",
    # MarkItDown pulls in onnxruntime (through magika); 1.20 has no wheel for Python 3.14.
    "onnxruntime==1.31.0",
    "pypdf==5.1.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false
# Installation rule: dependencies at least two weeks old since their release.
exclude-newer = "2026-10-24T00:00:00Z"

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]
