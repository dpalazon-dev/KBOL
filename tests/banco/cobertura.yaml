# Cobertura del "Banco mínimo previo" de docs/referencias/KB-DPP-implementacion.md.
# Una entrada por caso, con el texto exacto de la celda "Caso". Cada una lleva
# exactamente una de estas claves:
#   tests: ids de pytest de pruebas existentes que ejercitan el caso.
#   no_habilitada: capacidad aún no habilitada y por qué no se puede probar hoy.
#   pendiente: archivo de pruebas en curso; cuando exista, hay que sustituirlo por ids reales.

"Ratificación humana declarada solo en YAML":
  tests:
    - tests/test_autoridad.py::test_esc03_1_verified_escrito_por_el_agente_no_es_aprobacion

"Contenido modificado tras aprobar":
  tests:
    - tests/test_autoridad.py::test_esc03_3_contenido_cambiado_tras_revisar_caduca
    - tests/test_integrar.py::test_contenido_cambiado_despues_de_la_revision
    - tests/test_declarada.py::test_digests_distintos_de_lo_mostrado_caducan_la_aprobacion

"Cambio de rol que se autoriza a sí mismo":
  tests:
    - tests/test_integrar.py::test_esc03_4_una_persona_no_se_da_el_rol_que_usa_para_aprobar
    - tests/test_declarada.py::test_una_persona_no_se_da_el_rol_que_usa_para_aprobar

"Sustitución parcial y propuesta pendiente":
  tests:
    - tests/test_consolidar.py::test_esc01_sustitucion_parcial_sin_perder_condiciones
    - tests/test_contexto.py::test_paquete_con_restricciones_vigentes_y_propuestas_aparte

"Dos cambios incompatibles":
  tests:
    - tests/test_consolidar.py::test_esc01_variante_de_conflicto
    - tests/test_integrar.py::test_dos_sustituciones_aceptadas_de_la_misma_clausula_son_conflicto

"Consulta histórica con corrección tardía":
  tests:
    - tests/test_consolidar.py::test_esc02_consulta_b_retroactiva
    - tests/test_consolidar.py::test_esc02_consulta_c_dos_conocimientos

"Evidencia decisiva omitida":
  tests:
    - tests/test_consultar.py::test_una_cita_a_una_fuente_que_falta_es_evidencia_insuficiente
    - tests/test_contexto.py::test_carga_parcial_no_da_el_paquete_por_completo

"Síntesis cuyo texto fuente no cambia pero pierde vigencia":
  tests:
    - tests/test_soporte.py::test_sintesis_cuyo_texto_no_cambia_pero_pierde_vigencia
    - tests/test_cli_soporte.py::test_dos_pares_de_cortes_devuelven_el_cambio_y_su_cadena

"Reanudación con cambios sin integrar":
  tests:
    - tests/test_relevo.py::test_esc05_el_relevo_conserva_limites_y_no_da_nada_por_hecho
    - tests/test_relevo.py::test_cambios_locales_y_ajenos
    - tests/test_contexto.py::test_el_objetivo_sale_del_relevo_si_no_se_da

"Escritura completada con respuesta perdida":
  tests:
    - tests/test_integrar.py::test_respuesta_perdida_se_reconcilia_desde_el_commit
    - tests/test_integrar.py::test_esc03_5_repetir_la_operacion_devuelve_el_recibo_sin_segunda_aceptacion

"Fuente parcial o localizador reprocesado":
  tests:
    - tests/test_citas.py::test_original_ausente_es_no_comprobable
    - tests/test_citas.py::test_representacion_de_otro_original
    - tests/test_localizador.py::test_ida_y_vuelta_norma_pdf
