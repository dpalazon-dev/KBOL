name: Propuesta
description: Un cambio o una capacidad nueva para KBOL
title: "[propuesta] "
labels: ["propuesta"]
body:
  - type: markdown
    attributes:
      value: |
        Una capacidad nueva se discute aquí antes de abrir un pull request.
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Qué te pasó o qué no puedes hacer hoy, con un caso concreto.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Qué cambiaría en la CLI, el esquema o la documentación.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas
      description: Lo que ya probaste con KBOL tal como está, u otras herramientas.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de cambio
      options:
        - Mejora de algo que ya existe
        - Capacidad nueva
        - Documentación
        - Cambio del contrato KB-DPP
    validations:
      required: true
