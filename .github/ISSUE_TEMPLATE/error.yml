name: Error
description: Una orden de KBOL hace algo distinto de lo que dicen el README o docs/elecciones.md
title: "[error] "
labels: ["error"]
body:
  - type: textarea
    id: orden
    attributes:
      label: Orden exacta
      description: La línea completa, con sus argumentos.
      render: bash
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
      description: Y dónde lo dice la documentación, si lo dice.
    validations:
      required: true
  - type: textarea
    id: sobre
    attributes:
      label: Sobre JSON de la salida
      description: Incluye `resultado`, `advertencias` y `cobertura`. Quita rutas o datos privados.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de KBOL
      placeholder: "0.11.0"
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Sistema operativo, Python y git
      placeholder: "Ubuntu 24.04, Python 3.12, git 2.47"
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Un registro mínimo o un repositorio de prueba ayudan más que una descripción.
